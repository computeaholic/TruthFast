apiVersion: v1
kind: Pod
metadata:
  name: grpc-client
  namespace: spire-system
  annotations:
    sidecar.istio.io/inject: "false"
spec:
  nodeSelector:
    kubernetes.io/hostname: threadforge
  containers:
  - name: grpc-client
    image: fullstorydev/grpcurl
    command: ["/bin/sh", "-c", "sleep 1d"]
    volumeMounts:
    - name: plugins
      mountPath: /host/plugins_registry
  restartPolicy: Never
  volumes:
  - name: plugins
    hostPath:
      path: /var/lib/kubelet/plugins_registry
      type: Directory
