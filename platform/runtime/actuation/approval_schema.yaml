# ==============================================================================
# ThreadForge — Actuation Approval Schema
# ------------------------------------------------------------------------------
# This file represents a HUMAN-AUTHORIZED ACTUATION CONTRACT.
#
# It is:
#   - Produced by ReflexHooks (emit-only)
#   - Evaluated by Governance + SMPGuard
#   - Approved by a human
#   - Consumed by the Actuator Plane
#
# NO CODE executes from this file.
# ==============================================================================

apiVersion: threadforge.io/v1
kind: ActuationApproval

metadata:
  plan_id: "<uuid>"
  created_at: "<iso-8601>"
  created_by: "reflex-hooks"
  environment: "alpha"
  identity:
    spiffe_id: "<spiffe-id>"
    tier: "<tier>"
    namespace: "<namespace>"
    service_account: "<service-account>"

spec:
  intent:
    description: "Restart Istio control plane to recover blocked traffic"
    originating_signal: "REFLEX_EVENT"
    reflex_action: "RESTART_ISTIOD"

  commands:
    - cmd:
        - kubectl
        - -n
        - istio-system
        - rollout
        - restart
        - deployment/istiod

  safety:
    safe_action: true
    reversible: true
    rollback:
      - kubectl
      - -n
      - istio-system
      - rollout
      - undo
      - deployment/istiod

  governance:
    policy_version: "v1"
    allowed: false
    reason: "Awaiting human approval"

  smp:
    queue_depth: 0
    starvation_detected: false
    guard_verdict: "PENDING"

  approval:
    status: "PENDING"   # PENDING | APPROVED | REJECTED
    approved_by: null
    approved_at: null
    approval_method: null   # grafana | cli | ticket | git
    approval_notes: null

  integrity:
    digest:
      algorithm: "sha256"
      value: "<computed-over-canonical-yaml>"
    signed: false
    signature_ref: null