apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent
  namespace: agents-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: research-agent
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyImage: registry.threadforge.local:30500/istio/proxyv2@sha256:2f78ddd13cbf6f600c8bebb9f05b21f9b14e047ec5f8c88ef9f50abc8e14466b
        sidecar.istio.io/userVolume: '{"istio-custom-root-cert":{"configMap":{"name":"istio-ca-root-cert"}}}'
        sidecar.istio.io/userVolumeMount: '{"istio-custom-root-cert":{"mountPath":"/etc/certs","readOnly":true}}'
      labels:
        app: research-agent
    spec:
      serviceAccountName: research-agent
      containers:
        - name: research-agent
          image: registry.threadforge.local:30500/agents-lab/research-agent@sha256:efceb80afdea2b2efcc0472cf6344285b1e97de17d4ce25ba68e9dba41d2c6d6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: SPIFFE_ID
              value: spiffe://identity.threadforge.local/ns/agents-lab/sa/research-agent
          ports:
            - containerPort: 8000
---
