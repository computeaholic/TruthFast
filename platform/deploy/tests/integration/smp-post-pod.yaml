apiVersion: v1
kind: Pod
metadata:
  name: smp-post-pod
  namespace: threadforge-system
  labels:
    sidecar.istio.io/inject: "true"
spec:
  serviceAccountName: threadforge-client
  restartPolicy: Never
  containers:
  - name: curl
    image: registry.threadforge.local:30500/mirror/docker.io/curlimages/curl@sha256:00ad3093ef7b465fb9852fbf82704ddb1fff8ec5d9206a131c5e4eda875df94f
    command:
      - /bin/sh
      - -ec
      - |
        set -e
        echo '[*] POSTing to /vector/embed'
        curl -sS -X POST 'http://threadforge-api.threadforge.svc.cluster.local:8080/vector/embed' -H 'Content-Type: application/json' -d '{"payload":{"text":"smp-post-test"}}' -o /tmp/resp -w '\nHTTP_CODE:%{http_code}\n'
        echo '=== RESPONSE BODY ==='
        cat /tmp/resp || true
        echo '=== END ==='
        sleep 300
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
