apiVersion: v1
kind: Pod
metadata:
  name: smp-tproxy-client
  namespace: threadforge-system
  labels:
    sidecar.istio.io/inject: "true"
  annotations:
    sidecar.istio.io/interceptionMode: "TPROXY"
spec:
  serviceAccountName: threadforge-client
  restartPolicy: Never
  containers:
  - name: sh
    image: registry.threadforge.local:30500/mirror/docker.io/curlimages/curl@sha256:00ad3093ef7b465fb9852fbf82704ddb1fff8ec5d9206a131c5e4eda875df94f
    command:
      - /bin/sh
      - -c
      - |
        echo 'sleeping'; sleep 3600
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
