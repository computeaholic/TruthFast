apiVersion: batch/v1
kind: Job
metadata:
  name: smp-integration-test
  namespace: threadforge-system
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        test: smp-integration
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.istio.io/interceptionMode: "TPROXY"
    spec:
      serviceAccountName: threadforge-client
      restartPolicy: Never
      volumes:
        - name: repo-root
          hostPath:
            path: /home/threadforge/threadforge
            type: Directory
        - name: evidence-host
          hostPath:
            path: /home/threadforge/threadforge/platform/deploy/infra/observability/evidence/phase2/civ-integration
            type: DirectoryOrCreate
      containers:
        - name: smp-integration
          image: registry.threadforge.local:30500/mirror/docker.io/library/python@sha256:4425b101d08b39b4ad50908a91f25a05eb762a6f8881f14ecd06779fba08ac84
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              cat > /tmp/smp_integration.py <<'PY'
                import urllib.request, json, sys, time, uuid

                UID = str(uuid.uuid4())
                payload = {"payload": {"text": f"smp-integration-{UID}"}}

                def q_prom(query):
                    url = f"http://prometheus-operated.observability.svc.cluster.local:9090/api/v1/query?query={urllib.request.quote(query)}"
                    try:
                        with urllib.request.urlopen(url, timeout=5) as resp:
                            data = json.load(resp)
                            return float(data.get('data', {}).get('result', [[None, '0']])[0][1]) if data.get('data', {}).get('result') else 0.0
                    except Exception as e:
                        print('[WARN] prom query failed', e, file=sys.stderr)
                        return 0.0

                print('[*] querying initial counters')
                enq_before = q_prom('sum(smp_enqueued_total)')
                deq_before = q_prom('sum(smp_dequeued_total)')
                print('enq_before=', enq_before, 'deq_before=', deq_before)

                print('[*] POST embedding request (expect 200)')
                req = urllib.request.Request('http://threadforge-api.threadforge.svc.cluster.local:8080/vector/embed', data=json.dumps(payload).encode('utf-8'), headers={'Content-Type': 'application/json'})
                try:
                    with urllib.request.urlopen(req, timeout=10) as r:
                        body = r.read().decode('utf-8')
                        code = r.getcode()
                except Exception as e:
                    print('[ERROR] embed request failed', e, file=sys.stderr)
                    sys.exit(2)
                print('http_code=', code)
                print('body=', body)
                if code != 200:
                    print('ERROR: non-200 resp', code, file=sys.stderr)
                    sys.exit(2)

                # attempt to parse envelope_id from response
                try:
                    body_json = json.loads(body)
                    envelope_id = body_json.get('envelope_id') or body_json.get('trace_id') or ''
                except Exception:
                    envelope_id = ''
                print('envelope_id=', envelope_id)

                # wait for counters
                print('[*] waiting for counters to reflect enqueue/dequeue (timeout 60s)')
                start = time.time()
                while True:
                    enq_after = q_prom('sum(smp_enqueued_total)')
                    deq_after = q_prom('sum(smp_dequeued_total)')
                    print('enq_after=', enq_after, 'deq_after=', deq_after)
                    if (enq_after - enq_before) >= 1 and (deq_after - deq_before) >= 1:
                        print('SUCCESS: counters increased')
                        break
                    if time.time() - start > 60:
                        print('TIMEOUT: counters did not increase', file=sys.stderr)
                        sys.exit(3)
                    time.sleep(2)

                # print envelope id for external verifier to check logs
                if envelope_id:
                    print('ENVELOPE_ID='+envelope_id)
                else:
                    print('ERROR: could not extract envelope_id', file=sys.stderr)

                # deterministic post-step: collect Civ artifacts from host-mounted repo
                echo "[*] running deterministic evidence collection"
                # run collector if present in repo; do not fail the job on missing artifacts (CI will enforce)
                if [ -f /workspace/platform/deploy/tests/integration/collect_civ_artifacts.sh ]; then
                  if cd /workspace && sh platform/deploy/tests/integration/collect_civ_artifacts.sh /tmp/evidence; then
                    echo "[OK] collector finished"
                  else
                    echo "[WARN] collector failed or found issues - continuing (CI will enforce)" >&2
                  fi
                else
                  echo "[WARN] collector script not available in /workspace - ensure hostPath mount of repo is configured" >&2
                fi

                export EVIDENCE_DIR=/tmp/evidence
                export SUMMARY_FILE=/evidence-host/${POD_NAME:-${HOSTNAME}}.summary
                echo "[*] DecisionRecord summary (copied to $EVIDENCE_DIR)"
                mkdir -p "$(dirname "$SUMMARY_FILE")"
                # generate atomic summary: write to temp file and then rename into place
                python -c 'import json,glob,os,sys,io
                ed=os.environ.get("EVIDENCE_DIR","/tmp/evidence")
                sf=os.environ.get("SUMMARY_FILE")
                tmp = sf + ".tmp"
                buf = io.StringIO()
                files = sorted(glob.glob(ed+"/*.json"))
                if not files:
                    buf.write(f"[WARN] No DecisionRecord artifacts found in {ed}\n")
                else:
                    for f in files:
                        try:
                            data=json.load(open(f))
                            buf.write(f"ID: {data.get(\"decision_id\",\"\")}\n")
                            buf.write(f"generated_at: {data.get(\"generated_at\",\"\")}\n")
                            buf.write(f"provenance_hash: {data.get(\"provenance_hash\",\"\")}\n")
                            buf.write("---\n")
                        except Exception as e:
                            buf.write(f"[WARN] failed to parse {f}: {e}\n")
                # atomic write
                with open(tmp, "w") as fh:
                    fh.write(buf.getvalue())
                    fh.flush()
                    os.fsync(fh.fileno())
                os.replace(tmp, sf)
                # print summary to stdout for kubectl logs
                print(open(sf).read())'
                echo "[OK] summary written to $SUMMARY_FILE" || true
                PY
                sed -E -i 's/^ {16}//' /tmp/smp_integration.py
                python /tmp/smp_integration.py || true
          volumeMounts:
            - name: repo-root
              mountPath: /workspace
              readOnly: true
            - name: evidence-host
              mountPath: /evidence-host
              readOnly: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
