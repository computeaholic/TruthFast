apiVersion: v1
kind: ServiceAccount
metadata:
  name: threadforge-operator
  namespace: threadforge-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: threadforge-operator
  namespace: threadforge-system
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Namespace-scoped Role to enforce least privilege; adjust further as needed.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: threadforge-operator-binding
  namespace: threadforge-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: threadforge-operator
subjects:
  - kind: ServiceAccount
    name: threadforge-operator
    namespace: threadforge-system
