apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
    - /etc/prometheus/rules/*.yaml

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    - job_name: 'istio-proxy'
      kubernetes_sd_configs:
      - role: pod
      metrics_path: /stats/prometheus
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: keep
        regex: istio-proxy
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: drop
        regex: "false"
      - source_labels: [__meta_kubernetes_pod_ip]
        replacement: $1:15090
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
      - role: endpoints
      relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics

    - job_name: 'istiod'
      static_configs:
      - targets: ['istiod.istio-system.svc.cluster.local:15014']
      metrics_path: /metrics

    - job_name: 'threadforge-api'
      kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [threadforge]
      relabel_configs:
      - source_labels: [__meta_kubernetes_service_name]
        action: keep
        regex: threadforge-api
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http
      - target_label: __address__
        replacement: threadforge-api.threadforge.svc.cluster.local:8080

  trust-continuity-recording-rules.yaml: |
    groups:
    - name: trust-continuity
      rules:
      - record: threadforge_trust_source_spire_ca_root_cert_match_state
        expr: max(threadforge_trust_source_match{source="spire-ca-root-cert"})
      - record: threadforge_trust_source_istio_ca_root_cert_match_state
        expr: max(threadforge_trust_source_match{source="istio-ca-root-cert"})
      - record: threadforge_trust_source_istiod_mounted_root_match_state
        expr: max(threadforge_trust_source_match{source="istiod-mounted-root"})
      - record: threadforge_trust_source_workload_mounted_root_match_state
        expr: max(threadforge_trust_source_match{source="workload-mounted-root"})
      - record: threadforge_trust_reconciliation_last_outcome_success_state
        expr: max(threadforge_trust_reconciliation_last_outcome_success)
      - record: threadforge_trust_reconciliation_stale_state
        expr: max(threadforge_trust_reconciliation_last_run_age_seconds > 300)
      - record: threadforge_trust_publication_timestamp_set_state
        expr: max(threadforge_trust_publication_timestamp_set)
      - record: threadforge_trust_active_bundle_valid_cert_count_state
        expr: max(threadforge_trust_active_bundle_valid_cert_count)
      - record: threadforge_trust_publication_drift_state
        expr: max(threadforge_trust_publication_drift)
      - record: threadforge_trust_publication_healthy
        expr: 1 - clamp_max(max(threadforge_trust_publication_drift), 1)
      - record: threadforge_trust_expiration_warning_state
        expr: max(threadforge_trust_expiration_warning)
      - record: threadforge_trust_expiration_critical_state
        expr: max(threadforge_trust_expiration_critical)
      - record: threadforge_trust_expiration_emergency_state
        expr: max(threadforge_trust_expiration_emergency)

  trust-continuity-alert-rules.yaml: |
    groups:
    - name: trust-continuity.alerts
      rules:
      - alert: ThreadForgeTrustSourceMismatchSpireCaRootCert
        expr: max(threadforge_trust_source_match{source="spire-ca-root-cert"}) < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge SPIRE publication root mismatch"
          description: "spire-ca-root-cert no longer matches active SPIRE root."
      - alert: ThreadForgeTrustSourceMismatchIstioCaRootCert
        expr: max(threadforge_trust_source_match{source="istio-ca-root-cert"}) < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge Istio publication root mismatch"
          description: "istio-ca-root-cert no longer matches active SPIRE root."
      - alert: ThreadForgeTrustSourceMismatchIstiodMountedRoot
        expr: max(threadforge_trust_source_match{source="istiod-mounted-root"}) < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge istiod consumed root mismatch"
          description: "istiod consumed root no longer matches active SPIRE root."
      - alert: ThreadForgeTrustSourceMismatchWorkloadMountedRoot
        expr: max(threadforge_trust_source_match{source="workload-mounted-root"}) < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge workload projected root mismatch"
          description: "workload projected root no longer matches active SPIRE root."
      - alert: ThreadForgeTrustReconciliationStale
        expr: max(threadforge_trust_reconciliation_last_run_age_seconds) > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge trust reconciliation stale"
          description: "No trust reconciliation cycle has completed in the last 5 minutes."
      - alert: ThreadForgeTrustReconciliationFailedUnderDrift
        expr: max(threadforge_trust_publication_drift) > 0 and max(threadforge_trust_reconciliation_last_outcome_success) < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ThreadForge trust reconciliation failing under drift"
          description: "Trust drift is active and latest reconciliation outcome is failure."
      - alert: ThreadForgeTrustPublicationTimestampMissing
        expr: max(threadforge_trust_publication_timestamp_set) < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge trust publication timestamp missing"
          description: "Trust publication timestamp is unset; publication lifecycle cannot be aged."
      - alert: ThreadForgeTrustActiveBundleValidityAnomaly
        expr: max(threadforge_trust_active_bundle_valid_cert_count) < 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ThreadForge active SPIRE bundle has no valid certificates"
          description: "No currently valid certificate was observed in active SPIRE trust bundle."
      - alert: ThreadForgeTrustPublicationDrift
        expr: max(threadforge_trust_publication_drift) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge trust publication drift detected"
          description: "Distributed trust no longer matches active SPIRE root."
      - alert: ThreadForgeTrustRootExpiringWarning
        expr: max(threadforge_trust_expiration_warning) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ThreadForge trust root expiration warning"
          description: "Active trust root expires in less than 24 hours."
      - alert: ThreadForgeTrustRootExpiringCritical
        expr: max(threadforge_trust_expiration_critical) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ThreadForge trust root expiration critical"
          description: "Active trust root expires in less than 12 hours."
      - alert: ThreadForgeTrustRootExpiringEmergency
        expr: max(threadforge_trust_expiration_emergency) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ThreadForge trust root expiration emergency"
          description: "Active trust root expires in less than 1 hour."

  trust-root-lifecycle.rules.yaml: |
    groups:
    - name: trust-root-lifecycle
      rules:
      - record: threadforge_trust_continuity_state_code
        expr: |
          max(
            ((threadforge_trust_spire_lifecycle_ok == bool 1) * (threadforge_trust_prepare_due == bool 0) * 1)
            +
            ((threadforge_trust_spire_lifecycle_ok == bool 1) * (threadforge_trust_prepare_due == bool 1) * (threadforge_trust_continuous_successor_policy_ok == bool 0) * 2)
            +
            ((threadforge_trust_spire_lifecycle_ok == bool 1) * (threadforge_trust_prepare_due == bool 1) * (threadforge_trust_continuous_successor_policy_ok == bool 1) * (threadforge_trust_activate_due == bool 0) * 3)
            +
            ((threadforge_trust_spire_lifecycle_ok == bool 1) * (threadforge_trust_prepare_due == bool 1) * (threadforge_trust_continuous_successor_policy_ok == bool 1) * (threadforge_trust_activate_due == bool 1) * 4)
            +
            ((threadforge_trust_spire_lifecycle_ok == bool 0) * 8)
          )
      - record: threadforge_trust_prepare_window_missing_successor
        expr: max((threadforge_trust_prepare_due == bool 1) * (threadforge_trust_successor_count < bool 1))
      - record: threadforge_trust_coverage_gap_detected_state
        expr: max(threadforge_trust_coverage_gap_detected)
      - alert: TrustRootPrepareWindowMissingSuccessor
        expr: threadforge_trust_prepare_window_missing_successor == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Trust root successor missing during prepare window"
          description: "prepare_due is true but no prepared successor satisfies the continuity contract."
      - alert: TrustRootContinuityLost
        expr: threadforge_trust_spire_lifecycle_ok == 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SPIRE lifecycle contract violated"
          description: "SPIRE lifecycle health is not satisfied; investigate ACTIVE/PREPARED lifecycle state immediately."

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: http-web
  selector:
    app: prometheus

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
  namespace: observability
  labels:
    app: prometheus
spec:
  serviceName: prometheus
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
      annotations:
        kyverno.io/verify-images: '{"registry.threadforge.local:30500/mirror/docker.io/prom/prometheus@sha256:d1591daeb276e8c840b7264187c8d37f38e1e78388e21c4be69a7774a982d3c3":"pass","registry.threadforge.local:30500/istio/proxyv2@sha256:2f78ddd13cbf6f600c8bebb9f05b21f9b14e047ec5f8c88ef9f50abc8e14466b":"pass","registry.threadforge.local:30500/istio/proxyv2:1.29.0":"pass"}'
        sidecar.istio.io/proxyImage: 'registry.threadforge.local:30500/istio/proxyv2@sha256:2f78ddd13cbf6f600c8bebb9f05b21f9b14e047ec5f8c88ef9f50abc8e14466b'
        sidecar.istio.io/userVolume: '{"istio-custom-root-cert":{"configMap":{"name":"istio-ca-root-cert"}}}'
        sidecar.istio.io/userVolumeMount: '{"istio-custom-root-cert":{"mountPath":"/etc/certs","readOnly":true}}'
    spec:
      serviceAccountName: prometheus-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
      containers:
      - name: prometheus
        image: registry.threadforge.local:30500/mirror/docker.io/prom/prometheus@sha256:d1591daeb276e8c840b7264187c8d37f38e1e78388e21c4be69a7774a982d3c3
        imagePullPolicy: IfNotPresent
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prometheus"
        - "--storage.tsdb.retention.time=15d"
        ports:
        - containerPort: 9090
          name: web
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
        - name: rules
          mountPath: /etc/prometheus/rules
        - name: istio-custom-root-cert
          mountPath: /etc/certs
          readOnly: true
        - name: storage
          mountPath: /prometheus
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: rules
        configMap:
          name: prometheus-config
          items:
          - key: trust-continuity-recording-rules.yaml
            path: trust-continuity-recording-rules.yaml
          - key: trust-continuity-alert-rules.yaml
            path: trust-continuity-alert-rules.yaml
          - key: trust-root-lifecycle.rules.yaml
            path: trust-root-lifecycle.rules.yaml
      - name: istio-custom-root-cert
        configMap:
          name: istio-ca-root-cert
  volumeClaimTemplates:
  - metadata:
      name: storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: observability
