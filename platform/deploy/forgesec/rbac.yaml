apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgesec-sa
  namespace: forgesec
  labels:
    security.threadforge.local/role: boundary-validator
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgesec-readonly
  namespace: forgesec
rules:
  # Allow reading Services and Endpoints within forgesec namespace only.
  # This enables basic discovery for validation assertions.
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list"]

  # Allow reading Pods in forgesec namespace only (to introspect its own Job state)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  # Allow reading Jobs in forgesec namespace only (self-introspection)
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgesec-readonly-binding
  namespace: forgesec
subjects:
  - kind: ServiceAccount
    name: forgesec-sa
    namespace: forgesec
roleRef:
  kind: Role
  name: forgesec-readonly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: forgesec-istio-readonly
rules:
  - apiGroups: ["security.istio.io"]
    resources: ["peerauthentications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: forgesec-istio-readonly-binding
subjects:
  - kind: ServiceAccount
    name: forgesec-sa
    namespace: forgesec
roleRef:
  kind: ClusterRole
  name: forgesec-istio-readonly
  apiGroup: rbac.authorization.k8s.io
