apiVersion: v1
kind: Namespace
metadata:
  name: forgesec
  labels:
    istio-injection: "enabled"
---
apiVersion: v1
kind: Service
metadata:
  name: forgesec-pushgateway
  namespace: forgesec
  labels:
    app.kubernetes.io/name: forgesec-pushgateway
spec:
  selector:
    app.kubernetes.io/name: forgesec-pushgateway
  ports:
    - name: http
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgesec-pushgateway
  namespace: forgesec
  labels:
    app.kubernetes.io/name: forgesec-pushgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forgesec-pushgateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgesec-pushgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pushgateway
          image: registry.threadforge.local:30500/mirror/docker.io/prom/pushgateway@sha256:21a7911913498a2732d984a84876d6d729ac2cf6c26802665ea5904c2fc6df62
          imagePullPolicy: IfNotPresent
          args:
            - --web.listen-address=:9091
            - --persistence.file=/data/metrics.db
            - --persistence.interval=1m
          ports:
            - containerPort: 9091
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forgesec-pushgateway
  namespace: observability
  labels:
    release: tf-observability
    threadforge.io/component: forgesec
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: forgesec-pushgateway
  namespaceSelector:
    matchNames:
      - forgesec
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
