apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: observability-base

# Observability stack: namespace + Prometheus + Grafana
resources:
  - namespace.yaml
  - prometheus.yaml
  - prometheus-rbac.yaml
  - grafana.yaml

labels:
  - pairs:
      component: observability
      stack: metrics

commonAnnotations:
  description: "Observability infrastructure (Prometheus, Grafana, metrics)"
  namespace: observability
