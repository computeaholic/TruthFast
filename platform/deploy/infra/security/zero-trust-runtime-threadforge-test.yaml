apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: threadforge-test
spec:
  mtls:
    mode: STRICT

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: threadforge-test
spec: {}

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-echo
  namespace: threadforge-test
spec:
  selector:
    matchLabels:
      app: echo
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - identity.threadforge.local/ns/istio-system/sa/istio-ingressgateway
        - identity.threadforge.local/ns/threadforge-test/sa/test-client
        - spiffe://identity.threadforge.local/ns/istio-system/sa/istio-ingressgateway
        - spiffe://identity.threadforge.local/ns/threadforge-test/sa/test-client

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: echo-deny-operator-api
  namespace: threadforge-test
spec:
  selector:
    matchLabels:
      app: echo
  action: DENY
  rules:
  - to:
    - operation:
        ports:
        - "5678"
        paths:
        - /api/v1/operator*

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: threadforge-test
spec:
  podSelector: {}
  policyTypes:
  - Egress

---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: echo-istio-mtls
  namespace: threadforge-test
spec:
  host: echo.threadforge-test.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        connectTimeout: 5s
        maxConnectionDuration: 75s
      http:
        idleTimeout: 15s
