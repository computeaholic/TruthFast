apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-restrict
  namespace: observability
  annotations:
    threadforge.dev/managed-by: "manual-patch"
spec:
  podSelector:
    matchLabels:
      app: tempo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
          # restrict to observability namespace using namespaceSelector
          # because collectors are deployed there
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
        - podSelector:
            matchLabels:
              app: otel-gateway
        - podSelector:
            matchLabels:
              app: grafana
      ports:
        - port: 4317
        - port: 4318
        - port: 3100
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
          podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
        - port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
