apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tempo-restrict
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: tempo

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: otel-gateway
        - podSelector:
            matchLabels:
              app: grafana
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app: prometheus
        # Allow telemetry probe pods (for doctor gates)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              threadforge.dev/purpose: telemetry-probe
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgesec
      ports:
        - port: 4317
        - port: 4318
        - port: 9411
        - port: 3100

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: minio
          podSelector:
            matchLabels:
              app: minio
      ports:
        - port: 9000
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - port: 15012
        - port: 443
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
