apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: {{ .Release.Namespace }}
  labels:
    app: tempo
spec:
  type: ClusterIP
  ports:
    - name: http-api
      port: 3100
      targetPort: 3100
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: http-otlp
      port: 4318
      targetPort: 4318
  selector:
    app: tempo
