apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: tempo-podmonitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: tf-observability
spec:
  selector:
    matchLabels:
      app: tempo
  podMetricsEndpoints:
    - port: http
      interval: 15s
      path: /metrics
