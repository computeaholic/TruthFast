apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: operatorroutingpolicies.threadforge.io
spec:
  group: threadforge.io
  scope: Namespaced
  names:
    plural: operatorroutingpolicies
    singular: operatorroutingpolicy
    kind: OperatorRoutingPolicy
    shortNames:
      - orp
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                preferredOrder:
                  type: array
                  items:
                    type: string
                autoSwitch:
                  type: string
                  enum:
                    - static
                    - adaptive
                    - continuous
