# deployment/infra/qdrant/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: qdrant
spec:
  type: {{ .Values.service.type }}
  selector:
    app: qdrant
  ports:
    - name: http
      port: {{ .Values.service.port }}
    - name: grpc
      port: {{ .Values.service.grpcPort }}
