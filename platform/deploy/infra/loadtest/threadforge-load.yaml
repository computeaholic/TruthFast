---
apiVersion: v1
kind: Namespace
metadata:
  name: threadforge
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threadforge-client
  namespace: threadforge
---
apiVersion: v1
kind: Pod
metadata:
  name: threadforge-load
  namespace: threadforge
  labels:
    app: threadforge-load
    sidecar.istio.io/inject: "true"
spec:
  serviceAccountName: threadforge-client
  restartPolicy: Never
  containers:
  - name: load
    image: registry.threadforge.local:30500/istio/proxyv2@sha256:2f78ddd13cbf6f600c8bebb9f05b21f9b14e047ec5f8c88ef9f50abc8e14466b
    command: ["sh", "-c", "sleep 86400"]
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
