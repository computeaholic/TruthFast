{{- if and (.Capabilities.APIVersions.Has "security.istio.io/v1beta1/PeerAuthentication") (.Values.spireServer.peerAuthentication.enabled | default false) }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: spire-server-strict
  namespace: spire-system

# ThreadForge bootstrap and proof now require effective STRICT mTLS in spire-system.
# Keep the policy scoped to the SPIRE server workload so the chart continues to own
# the server-specific baseline while the namespace-wide strict policy remains authoritative.
spec:
  selector:
    matchLabels:
      app: spire-server
  mtls:
    mode: STRICT
{{- end }}
