server {
  bind_address = "0.0.0.0"
  bind_port    = "8081"
  trust_domain = "identity.threadforge.local"

  data_dir    = "/run/spire/data"
  ca_key_type = "ec-p256"
  log_level   = "INFO"

  # Admin socket used for registration actions in CI and by operators
  socket_path = "/run/spire/private/spire-server.sock"
}

upstream_authority "disk" {
  directory = "/run/spire/data/ca"
}

plugins {
  KeyManager "disk" {
    plugin_data {
      keys_path = "/run/spire/data/keys.json"
    }
  }

  # Required for SPIRE Agent join-token node attestation (used in CI only)
  NodeAttestor "join_token" {
    plugin_data {}
  }

  DataStore "sql" {
    plugin_data {
      database_type     = "sqlite3"
      connection_string = "/run/spire/data/datastore.sqlite3"
    }
  }

  # CI note: we rely on agent-side 'insecure_bootstrap' for deterministic bootstrap in ephemeral CI.
  # Production setups MUST use k8s_psat or equivalent node attestor; do not copy the CI pattern to prod.
}
