agent {
  data_dir = "/run/spire/data"
  log_level = "INFO"
  trust_domain = "identity.threadforge.local"

  # For CI determinism only: allow insecure bootstrap so the agent can obtain SVID
  # without production-grade attestation. This is intentionally explicit.
  insecure_bootstrap = true

  # Workload API socket path used by ThreadForge tests and CI probes
  socket_path = "/tmp/spire-socket-host/threadforge_spiffe.sock"

  # Server discovery (container DNS via created docker network)
  server_address = "spire-server"
  server_port = "8081"
}

plugins {
  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/data/keys"
    }
  }

  NodeAttestor "join_token" {
    plugin_data {}
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
