apiVersion: v1
kind: Pod
metadata:
  name: spire-workload-test
  namespace: default
spec:
  serviceAccountName: default
  restartPolicy: Never
  containers:
    - name: test
      image: registry.threadforge.local:30500/spire-agent@sha256:0d3cebdf4e033edaa67ef1b4197696f853bb76f8970e25010237c7e3a7c98531
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
  volumes:
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/sockets
        type: Directory
