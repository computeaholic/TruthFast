# =====================================================================
# ThreadForge — Kyverno Helm Values
# platform/deploy/infra/kyverno/values.yaml
# =====================================================================
# Render every Kyverno image as an internal digest-pinned reference.
# The chart only supports repository + tag, so repository values end with
# @sha256 and the tag carries the raw digest hex.
global:
  image:
    registry: ~
  # Mount the node's system CA bundle (which includes the ThreadForge ingress CA,
  # added during cluster bootstrap) so Kyverno can reach both:
  #   1. registry.threadforge.local:30500 (local TLS registry)
  #   2. tuf-repo-cdn.sigstore.dev (internet sigstore TUF)
  # Using hostPath so helm does not embed the 200KB bundle in the release secret.
  caCertificates:
    volume:
      hostPath:
        path: /etc/ssl/certs/ca-certificates.crt
        type: File

crds:
  migration:
    enabled: false

webhooksCleanup:
  image:
    registry: registry.threadforge.local:30500
    repository: mirror/docker.io/bitnami/kubectl@sha256
    tag: a84ef19c1c38286cb674c90182bd8b4e1d11ed4e089e5994f553cbe5d67d9068
    pullPolicy: Always

