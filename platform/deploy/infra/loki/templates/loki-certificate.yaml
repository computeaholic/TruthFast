{{- if and .Values.istio .Values.istio.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: loki-tls
  namespace: istio-system
spec:
  secretName: loki-tls-secret
  issuerRef:
    name: threadforge-ca
    kind: ClusterIssuer
  dnsNames:
    - "loki.observability.svc.cluster.local"
    - "loki.threadforge.local"
{{- end }}
