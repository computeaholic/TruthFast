apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: drift-classifier
  namespace: observability
  labels:
    threadforge.io/component: drift-classifier
spec:
  selector:
    matchLabels:
      app: drift-classifier
  namespaceSelector:
    matchNames:
      - threadforge
  endpoints:
    - port: http
      interval: 5s
      path: /metrics
