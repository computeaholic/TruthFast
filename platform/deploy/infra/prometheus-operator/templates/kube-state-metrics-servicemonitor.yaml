apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-state-metrics
  namespace: observability
  labels:
    threadforge.io/component: kube-state-metrics
    threadforge-monitor: enabled
    threadforge.monitor/enabled: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: kube-prometheus-stack
  namespaceSelector:
    matchNames:
      - monitoring
  endpoints:
    - port: http
      interval: 15s
      scrapeTimeout: 10s
      path: /metrics
      {{- include "prometheus.metricNameAsciiOnly" . | nindent 6 }}
