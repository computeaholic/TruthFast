apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm-bravo
  namespace: observability
  labels:
    threadforge.io/component: vllm-bravo
spec:
  selector:
    matchLabels:
      app: vllm-bravo
  namespaceSelector:
    matchNames:
      - vllm-bravo
  endpoints:
    - port: metrics
      interval: 10s
      path: /metrics
