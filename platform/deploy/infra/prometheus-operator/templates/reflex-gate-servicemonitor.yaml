apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: reflex-gate
  namespace: observability
  labels:
    threadforge.io/component: reflex-gate
spec:
  selector:
    matchLabels:
      app: reflex-gate
  namespaceSelector:
    matchNames:
      - threadforge
  endpoints:
    - port: http
      interval: 5s
      path: /metrics
