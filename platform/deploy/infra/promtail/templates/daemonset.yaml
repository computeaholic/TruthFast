apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      priorityClassName: {{ .Values.priorityClassName | quote }}
      serviceAccountName: promtail-sa
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: promtail
          image: registry.threadforge.local:30500/mirror/docker.io/grafana/promtail@sha256:4a039ade78d3ecac1dac83be74c0f3c9209d6c5f850db59b4004661e45309a5e
          args:
            - -config.file=/etc/promtail/promtail.yaml
            - -log.level=info
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
{{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/promtail/
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
