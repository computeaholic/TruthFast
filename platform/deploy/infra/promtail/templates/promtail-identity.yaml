# =====================================================================
# ThreadForge — Promtail Identity Bundle
# Namespace: observability
# =====================================================================

# ---------------------------------------------------------------------
# 1. ServiceAccount (defines SPIFFE principal)
# ---------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: promtail

---
# ---------------------------------------------------------------------
# 2. WorkloadEntry — SPIFFE Identity Binding
# ---------------------------------------------------------------------
apiVersion: networking.istio.io/v1
kind: WorkloadEntry
metadata:
  name: promtail-identity
  namespace: {{ .Release.Namespace }}
spec:
  serviceAccount: promtail-sa
  address: "127.0.0.1"

---
# ---------------------------------------------------------------------
# 3. STRICT mTLS
# ---------------------------------------------------------------------
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: promtail-mtls
  namespace: {{ .Release.Namespace }}
spec:
  mtls:
    mode: STRICT
