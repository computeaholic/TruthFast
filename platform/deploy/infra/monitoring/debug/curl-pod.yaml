apiVersion: v1
kind: Pod
metadata:
  name: curltest
  namespace: observability
spec:
  serviceAccountName: observability-seed-sa
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: registry.threadforge.local:30500/curlimages-curl@sha256:56efe57deecfd4145a36b24f1cfd676f8cbda808b5ce56d0f644ca0db6b1c0de
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
  restartPolicy: Never
