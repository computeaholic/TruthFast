# ==============================================================================
# ThreadForge — Vector Engine Postgres Credentials Secret
# Vault Agent Injector populates this secret at runtime.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: vectordb-postgres
  namespace: vectordb
type: Opaque
stringData:
  username: "{{ .Values.postgres.user }}"
  database: "{{ .Values.postgres.db }}"
  # password is patched at runtime by Vault Agent
