apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vector-api-zero-trust
spec:
  podSelector:
    matchLabels:
      app: vector-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              threadforge.io/mesh: allowed
      ports:
        - protocol: TCP
          port: 8088
  egress:
    - to:
        - podSelector:
            matchLabels:
              tier: vector-backend
