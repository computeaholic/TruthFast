apiVersion: 1
datasources:
  - name: Tempo Search Capsules
    type: tempo
    access: proxy
    url: http://tempo.observability.svc.cluster.local:3100
    jsonData:
      tracesToLogs:
        mapAttributes:
          - key: capsule
          - key: lineage_hash
          - key: reflex_verdict
      search:
        filters:
          - name: Capsule Events
            query: "{ capsule != \"\" }"
          - name: High Drift Capsules
            query: "{ drift_score > 0.7 }"
          - name: Reflex Vetoed Capsules
            query: "{ reflex_verdict = \"block\" }"
