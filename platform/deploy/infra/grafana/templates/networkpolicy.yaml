apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-restrict
  namespace: observability
spec:
  podSelector:
    matchLabels:
      app: grafana

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              istio: ingressgateway
    - from:
        - namespaceSelector:
            matchLabels:
              threadforge.io/plane: observability
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forgesec
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              threadforge.dev/purpose: telemetry-probe

  egress:
    # Allow requests to Tempo
    - to:
        - namespaceSelector:
            matchLabels:
              threadforge.io/plane: observability
          podSelector:
            matchLabels:
              app: tempo
    # Allow requests to Loki
    - to:
        - namespaceSelector:
            matchLabels:
              threadforge.io/plane: observability
          podSelector:
            matchLabels:
              app: loki
    # Allow requests to Prometheus
    - to:
        - namespaceSelector:
            matchLabels:
              threadforge.io/plane: observability
          podSelector:
            matchLabels:
              app: prometheus
    # Allow DNS queries
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
