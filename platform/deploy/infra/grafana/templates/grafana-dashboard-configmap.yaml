apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app: grafana
    threadforge.io/owned-by: grafana-chart
    threadforge.io/dashboard-source: canonical
data:
{{- range $path, $bytes := .Files.Glob "dashboards/*" }}
  {{ base $path }}: |
{{ toString $bytes | indent 4 }}
{{- end }}
{{- range $path, $bytes := .Files.Glob "dashboards/value-plane/*" }}
  {{ base $path }}: |
{{ toString $bytes | indent 4 }}
{{- end }}
