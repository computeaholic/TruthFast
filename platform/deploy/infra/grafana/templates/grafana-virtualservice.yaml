apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: grafana-vs
  namespace: observability
spec:
  hosts:
    - "grafana.threadforge.local"
    - "grafana.internal.threadforge.local"
  gateways:
    - istio-system/grafana-gateway
  http:
    - match:
        - uri:
            prefix: "/"
      route:
        - destination:
            host: grafana.observability.svc.cluster.local
            port:
              number: 3000
