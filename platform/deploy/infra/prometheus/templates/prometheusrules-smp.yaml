apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: threadforge-smp-alerts
  namespace: monitoring
  labels:
    threadforge-rules: enabled
spec:
  groups:
    - name: smp-health
      rules:

        - alert: SMPQueuePressureHigh
          expr: threadforge_smp_queue_depth > 25
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: "SMP queue pressure rising"
            description: "SMP queue depth exceeded 25 items."

        - alert: SMPStarvationDetected
          expr: rate(threadforge_smp_starvation_total[1m]) > 0
          for: 15s
          labels:
            severity: critical
          annotations:
            summary: "SMP starvation detected"
            description: "One or more envelopes exceeded their priority SLO."

        - alert: SMPDispatchLag
          expr: histogram_quantile(0.95, rate(threadforge_smp_queue_latency_ms_bucket[2m])) > 250
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "SMP dispatch latency too high"
            description: "P95 SMP queue latency exceeded governance limits."

        - alert: SMPScalingRecommendedImmediate
          expr: rate(threadforge_smp_scaling_recommendation_total{recommendation="scale_immediately"}[30s]) > 0
          for: 10s
          labels:
            severity: critical
          annotations:
            summary: "Immediate SMP scaling recommended"
            description: "Dispatcher detected sustained P1 backlog."

        - alert: SMPHighPriorityLatency
          expr: histogram_quantile(
                  0.95,
                  sum by (le) (
                    rate(threadforge_smp_queue_latency_ms_bucket{priority="P1"}[1m])
                  )
                ) > 25
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: "P1 SMP latency breach"
            description: "P95 latency for P1 exceeds governance SLO."

        - alert: SMPBacklogPressure
          expr: threadforge_smp_queue_depth > 25
          for: 15s
          labels:
            severity: warning
          annotations:
            summary: "SMP backlog pressure"
            description: "SMP queue depth exceeded 25 items."
