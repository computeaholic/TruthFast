apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: threadforge-require-signed-images
  annotations:
    policies.kyverno.io/title: ThreadForge Require Signed Images
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signatures
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - istio-system
                - kyverno
                - spire-system
                - local-path-storage
      verifyImages:
        - imageReferences:
            - "registry.threadforge.local:30500/*"
          imageRegistryCredentials:
            secrets:
              - registry-credentials
          mutateDigest: false
          verifyDigest: true
          required: true
          useCache: true
          attestors:
            - count: 1
              entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE8xDeE7rWcxz6O8xqoF2iqetycjhS
                      damvMVjBRTALshh6LJRCnP42jXS/5eblP3d9H7rowDbY/UcRueVSLg5kQQ==
                      -----END PUBLIC KEY-----
                    # ThreadForge local registry images are signed offline. External
                    # Rekor/tlog queries are disabled (ignoreTlog: true) because the
                    # kind cluster has no external Rekor entries for locally-signed
                    # images. Signature verification (ECDSA P-256 key) remains
                    # mandatory, and caching keeps repeated admissions within the
                    # fixed webhook budget.
                    ctlog:
                      ignoreSCT: true
                    rekor:
                      ignoreTlog: true
                      url: https://rekor.sigstore.dev
