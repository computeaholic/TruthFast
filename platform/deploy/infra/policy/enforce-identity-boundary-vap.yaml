apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: threadforge-enforce-identity-boundary-pods
  labels:
    threadforge.io/layer: identity-boundary
    threadforge.io/default-deny: "true"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: exemptNamespaces
      expression: >-
        ['kube-system', 'kube-public', 'kube-node-lease', 'istio-system',
         'spire-system', 'spire', 'kyverno', 'cert-manager']
    - name: namespaceLabels
      expression: >-
        has(namespaceObject.metadata) && has(namespaceObject.metadata.labels) ? namespaceObject.metadata.labels : {}
    - name: namespaceParticipatesInMesh
      expression: >-
        request.namespace in variables.exemptNamespaces ||
        ('istio-injection' in variables.namespaceLabels && variables.namespaceLabels['istio-injection'] == 'enabled')
    - name: serviceAccountName
      expression: >-
        has(object.spec.serviceAccountName) ? object.spec.serviceAccountName : ''
    - name: hasSidecarOptOut
      expression: >-
        has(object.metadata.annotations) &&
        'sidecar.istio.io/inject' in object.metadata.annotations &&
        object.metadata.annotations['sidecar.istio.io/inject'] == 'false'
    - name: hasFakeSpiffeEnv
      expression: >-
        object.spec.containers.exists(c,
          has(c.env) &&
          c.env.exists(e, e.name in ['SPIFFE_ENDPOINT_SOCKET', 'GRPC_XDS_BOOTSTRAP'])
        )
  validations:
    - expression: variables.namespaceParticipatesInMesh
      message: >-
        [DENIED_POLICY] Identity boundary is default-deny: workloads are only allowed in
        namespaces that explicitly set istio-injection=enabled.
    - expression: variables.serviceAccountName != '' && variables.serviceAccountName != 'default'
      message: >-
        [DENIED_POLICY] Identity-bound workloads must set a non-default serviceAccountName.
    - expression: '!variables.hasSidecarOptOut'
      message: >-
        [DENIED_POLICY] sidecar.istio.io/inject=false is forbidden cluster-wide.
    - expression: '!variables.hasFakeSpiffeEnv'
      message: >-
        [DENIED_POLICY] Manual SPIFFE_ENDPOINT_SOCKET or GRPC_XDS_BOOTSTRAP injection is forbidden.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: threadforge-enforce-identity-boundary-pods-binding
spec:
  policyName: threadforge-enforce-identity-boundary-pods
  validationActions: [Deny]
---
