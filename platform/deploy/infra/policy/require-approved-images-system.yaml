apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: threadforge-require-approved-images-system
  annotations:
    policies.kyverno.io/title: ThreadForge Require Approved Images In System Namespaces
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: require-approved-system-images
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - kube-system
                - istio-system
                - kyverno
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: AnyIn
            value:
              - CREATE
              - UPDATE
      validate:
        message: "Only approved system images are allowed"
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[].image || `[]` }}"
                operator: AnyNotIn
                value:
                  # ── bitnami/kubectl (cleanup jobs) ────────────────────────
                  - bitnami/kubectl:1.28.5
                  - registry.threadforge.local:30500/mirror/docker.io/bitnami/kubectl:1.31.4@sha256:a84ef19c1c38286cb674c90182bd8b4e1d11ed4e089e5994f553cbe5d67d9068
                  # ── kyverno controllers ───────────────────────────────────
                  - registry.threadforge.local:30500/kyverno/background-controller@sha256:148e3f0f5f0c84f3cf1428f5460b680c15d1e190f3e6182e2e02ff177071a5be
                  - registry.threadforge.local:30500/kyverno/background-controller:v1.12.6@sha256:148e3f0f5f0c84f3cf1428f5460b680c15d1e190f3e6182e2e02ff177071a5be
