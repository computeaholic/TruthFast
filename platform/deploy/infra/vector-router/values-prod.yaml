replicaCount: 3

resources:
  grpc:
    limits:
      cpu: "4000m"
      memory: "8Gi"
    requests:
      cpu: "1500m"
      memory: "4Gi"

  proxy:
    limits:
      cpu: "1000m"
      memory: "1Gi"
    requests:
      cpu: "250m"
      memory: "256Mi"

gpu:
  enabled: true
  vendor: auto
  allocate: true
