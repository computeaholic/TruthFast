# ==============================================================================
# ThreadForge — MinIO RBAC (ServiceAccount + Minimal Permissions)
# platform/deploy/infra/minio/templates/rbac.yaml
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-sa
  namespace: minio

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minio-sa-role
  namespace: minio
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "secrets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minio-sa-rb
  namespace: minio
subjects:
  - kind: ServiceAccount
    name: minio-sa
roleRef:
  kind: Role
  name: minio-sa-role
  apiGroup: rbac.authorization.k8s.io
