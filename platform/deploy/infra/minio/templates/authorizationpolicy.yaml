apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: minio-allow-ingressgateway
  namespace: minio
spec:
  selector:
    matchLabels:
      app: minio
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        - spiffe://identity.threadforge.local/ns/istio-system/sa/istio-ingressgateway
    to:
    - operation:
        ports: ["9000", "9001"]
