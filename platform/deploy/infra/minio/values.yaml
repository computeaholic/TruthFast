# =====================================================================
# ThreadForge — MinIO OSS (Strict Compatible Values)
# platform/deploy/infra/minio/values.yaml
# =====================================================================

replicaCount: 1

image:
  repository: registry.threadforge.local:30500/minio/minio
  tag: RELEASE.2025-09-07T16-13-09Z
  digest: sha256:9966a92a734f9411e32f4f41d7d9d826fcdc0f68c4e20b70295bd4e7c11f8a2f
  pullPolicy: IfNotPresent


mode: standalone

rootUser: ""  # MUST be set explicitly during install
rootPassword: ""  # MUST be set explicitly during install
existingSecretName: minio-secrets

persistence:
  enabled: true
  storageClass: standard
  size: 20Gi

priorityClassName: threadforge-low

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# MinIO S3 + Console ports
service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# ThreadForge defaults
lifecycle:
  loraExpireDays: 60
  eventRetentionDays: 30
  auditRetentionDays: 90
  uploadRetentionDays: 7

threadforgeBuckets:
  - tf-models
  - tf-lora
  - tf-events
  - tf-sim
  - tf-audit
  - tf-uploads

jobs:
  enableReplication: false
  enableBucketBootstrap: false
  enableVaultSTS: false
