apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
  namespace: build-system
  annotations:
    description: "Example secret containing registry credentials and CA bundle. Create your own secret; do not commit real secrets."
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths": {"registry.threadforge.local:30500": {"auth": "BASE64(user:pass)"}}}
# For REGISTRY_CA, create an additional Secret or mount a CA directory via a projected secret.
# Example CA secret (tls format):
# apiVersion: v1
# kind: Secret
# metadata:
#   name: registry-ca
#   namespace: build-system
# data:
#   ca.crt: |-
#     <base64-encoded-ca>
