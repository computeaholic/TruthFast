apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: threadforge-grpc-gateway
  namespace: threadforge-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 443
      name: grpc
      protocol: HTTPS
    tls:
      mode: ISTIO_MUTUAL
    hosts:
    - grpc.threadforge.local
    - "*"
