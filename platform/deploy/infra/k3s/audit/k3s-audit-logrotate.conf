/var/log/kubernetes/audit/audit.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    maxsize 200M

    postrotate
        # operator must replace /REPO_PATH with repository absolute path before installing
        /REPO_PATH/deploy/infra/k3s/audit/scripts/audit_rotation_chain.sh >> /var/log/kubernetes/audit/rotation_chain.log 2>&1 || true
    endscript
}
