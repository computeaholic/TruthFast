apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: threadforge-collector
  namespace: observability
spec:
  host: threadforge-collector
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 10
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: tempo
  namespace: observability
spec:
  host: tempo.observability.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
