apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "identity-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "identity-controller.name" . }}
    chart: {{ include "identity-controller.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
rules:
  - apiGroups: ["identity.threadforge.local"]
    resources: ["identityregistrations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["identity.threadforge.local"]
    resources: ["identityregistrations/status"]
    verbs: ["get", "update", "patch"]