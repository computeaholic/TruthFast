# ==============================================================================
# PHASE X: Example Claims (Optional, Not Applied by Default)
# ==============================================================================
#
# Purpose:
#   These are EXAMPLE claims showing how to bind to existing infrastructure.
#   They are NOT automatically applied.
#   They serve as documentation of the claim pattern.
#
# Authority:
#   Claims succeed only if infrastructure (from OpenTofu) exists.
#   Claims fail cleanly if infrastructure is missing.
#   Claims do NOT create infrastructure.
#
# Usage:
#   These examples show how future Civ Engine or applications
#   may declare infrastructure dependencies.
#
# ==============================================================================

# Example Network Claim (Development)
# Binds to: threadforge-dev VPC from OpenTofu
---
apiVersion: threadforge.local/v1
kind: XNetworkClaim
metadata:
  name: dev-network-claim
  namespace: threadforge
  labels:
    environment: dev
    phase: X
spec:
  environment: dev
  vpcId: "10.0.0.0/16"  # From OpenTofu output: module.network.vpc_cidr
  customLabels:
    app.kubernetes.io/managed-by: threadforge-crossplane
    threadforge.io/phase: X

---

