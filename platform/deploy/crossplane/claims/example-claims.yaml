# ==============================================================================
# HOW TO USE THESE CLAIMS
# ==============================================================================
#
# These claims are EXAMPLES ONLY.
# They are NOT applied by default (not in platform/deploy/base/crossplane/).
#
# To test claim binding:
#   1. Verify OpenTofu infrastructure exists
#   2. Apply XRDs: kubectl apply -f xrd/claims.yaml
#   3. Apply compositions: kubectl apply -f compositions/binding-compositions.yaml
#   4. Apply ONE example claim: kubectl apply -f claims/example-dev-network.yaml
#   5. Verify claim binding: kubectl get xnetworkclaims
#
# Expected result:
#   - Claim is READY
#   - No infrastructure created
#   - Binding ConfigMaps created (metadata only)
#   - No reconciliation loops
#
# If claim fails:
#   - Check: Does referenced infrastructure exist in OpenTofu outputs?
#   - Check: Is kubeconfig secret properly configured?
#   - Check: Are XRDs and compositions installed?
#
# ==============================================================================
