# Example Cluster Claim (Development)
# Binds to: threadforge-dev cluster from OpenTofu
apiVersion: threadforge.local/v1
kind: XClusterClaim
metadata:
  name: dev-cluster-claim
  namespace: threadforge
  labels:
    environment: dev
    phase: X
spec:
  environment: dev
  clusterId: "threadforge-dev"  # From OpenTofu output: module.cluster.cluster_name
  kubeconfig: "threadforge-dev-kubeconfig"  # Secret ref (future)
  customLabels:
    app.kubernetes.io/managed-by: threadforge-crossplane
    threadforge.io/phase: X

---

