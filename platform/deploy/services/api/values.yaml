image:
  repository: registry.threadforge.local:30500/threadforge-api
  digest: sha256:eb55cee8e7baedb754731d405b302713225510bad398508c206c187c1c6fa0e9
  pullPolicy: IfNotPresent

service:
  port: 8080

# Ingress disabled (Istio is used instead)
ingress:
  enabled: false

env:
  LOG_LEVEL: "INFO"
  THREADFORGE_DEBUG_MODE: "false"
  THREADFORGE_IGNORE_SCHEMA_WARNINGS: "false"
  THREADFORGE_SPIRE_AGENT_SOCKET: "/run/spire/sockets/socket"

# Opt-in flag to allow debug/trace logging for this chart
allowDebugLogs: false

host: "api.local"

observations:
  enabled: false
  path: /var/run/threadforge/observations
