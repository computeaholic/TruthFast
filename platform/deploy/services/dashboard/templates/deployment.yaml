apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
        sidecar.istio.io/inject: "true"
      annotations:
        sidecar.opentelemetry.io/inject: "true"
        otel.threadforge.io/enabled: "true"
    spec:
      securityContext:
        runAsUser: 1006
        runAsGroup: 1006
        fsGroup: 1006
      containers:
        - name: dashboard
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 4317
              name: otlp-grpc
              protocol: TCP
          envFrom:
            - configMapRef:
                name: dashboard-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
