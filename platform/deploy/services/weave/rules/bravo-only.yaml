apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: api-bravo-only
  namespace: threadforge
spec:
  host: api.threadforge.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      localityLbSetting:
        enabled: true
        failover:
          - from: "*"
            to: "bravo"
