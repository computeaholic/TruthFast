apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: threadforge-prod

# Reference the base configuration
bases:
  - ../../base

# Production-specific labels and annotations
labels:
  - pairs:
      environment: prod
      deployment: production
      tier: critical

commonAnnotations:
  environment: "production"
  sync-policy: "manual"
  auto-sync: "false"
  argocd.argoproj.io/sync-wave: "0"
  description: "Production infrastructure (manual sync, explicit approval required)"

# Image pinning for prod (stable versions only)
images:
  - name: prom/prometheus
    newName: registry.threadforge.local:30500/mirror/docker.io/prom/prometheus
    digest: sha256:d1591daeb276e8c840b7264187c8d37f38e1e78388e21c4be69a7774a982d3c3
  - name: grafana/grafana
    newName: registry.threadforge.local:30500/mirror/docker.io/grafana/grafana
    digest: sha256:8ae0684bf0a3ee176d511443facfcf2af5188f5d28ffc248f3ac2a9f503739c2

# Patches can go here for prod-specific changes
# NONE REQUIRED FOR PHASE K (behavior must not change)
patches: []
