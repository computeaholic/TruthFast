apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sovereignagents.threadforge.io
spec:
  group: threadforge.io
  scope: Namespaced
  names:
    plural: sovereignagents
    singular: sovereignagent
    kind: SovereignAgent
    shortNames:
      - sage
      - sagent
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                identityRef:
                  type: string
                role:
                  type: string
                behaviors:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      contract:
                        type: string
                resources:
                  type: object
                  properties:
                    model:
                      type: string
                    cacheMB:
                      type: integer
