apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sovereignclusters.threadforge.io
spec:
  group: threadforge.io
  scope: Cluster
  names:
    kind: SovereignCluster
    plural: sovereignclusters
    singular: sovereigncluster
    shortNames:
      - svcluster
      - svc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                trustDomain:
                  type: string
                spireEndpoint:
                  type: string
                bundleEndpoint:
                  type: string
                federationEnabled:
                  type: boolean
                clusterRole:
                  type: string
                  enum: ["alpha", "bravo", "charlie", "standalone"]
                selectors:
                  type: array
                  items:
                    type: string
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    required: ["type", "status"]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                observedGeneration:
                  type: integer
      subresources:
        status: {}
