apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: threadforge
  labels:
    app: router
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
        topology.istio.io/network: threadforge-mesh
        security.threadforge.io/pod: restricted
        sidecar.istio.io/inject: "true"
      annotations:
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
    spec:
      serviceAccountName: router-sa
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000

      containers:
        - name: router
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              name: http

          env:
            - name: THREADFORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: router-api-key
                  key: key

            # OTEL
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.otel.endpoint }}"
            - name: OTEL_SERVICE_NAME
              value: "router-go"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3

          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 8
            periodSeconds: 5

          resources: {{- toYaml .Values.resources | nindent 12 }}

      terminationGracePeriodSeconds: 15
