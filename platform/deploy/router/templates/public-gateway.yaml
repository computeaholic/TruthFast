apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: router-public-gateway
  namespace: threadforge
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: ISTIO_MUTUAL
      hosts:
        - "router.threadforge.svc.cluster.local"
