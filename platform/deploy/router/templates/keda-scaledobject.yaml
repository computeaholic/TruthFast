apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: router-autoscale
  namespace: threadforge
spec:
  scaleTargetRef:
    name: threadforge-router
  minReplicaCount: 2
  maxReplicaCount: 10
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-k8s.observability:9090
        metricName: threadforge_router_requests_total
        threshold: "200"