apiVersion: v1
kind: ServiceAccount
metadata:
  name: threadforge-deployer
  namespace: argocd
  labels:
    app: threadforge-deployer

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: threadforge-deployer-observability
  namespace: observability
  labels:
    app: threadforge-deployer
rules:
# EXPLICIT: Can manage only observability infrastructure
# ConfigMaps, Secrets, Services, Deployments, StatefulSets
- apiGroups: [""]
  resources: ["configmaps", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]  # Read-only for secrets (managed externally)

- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]

- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: threadforge-deployer-observability
  namespace: observability
  labels:
    app: threadforge-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: threadforge-deployer-observability
subjects:
- kind: ServiceAccount
  name: application-controller
  namespace: argocd

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: threadforge-deployer-istio
  namespace: istio-system
  labels:
    app: threadforge-deployer
rules:
# EXPLICIT: Can manage only Istio networking infrastructure
- apiGroups: ["networking.istio.io"]
  resources: ["virtualservices", "destinationrules", "gateways", "serviceentries", "workloadgroups", "requestauthentications", "authorizationpolicies"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

- apiGroups: [""]
  resources: ["services", "configmaps"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: threadforge-deployer-istio
  namespace: istio-system
  labels:
    app: threadforge-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: threadforge-deployer-istio
subjects:
- kind: ServiceAccount
  name: application-controller
  namespace: argocd

---
# CRITICAL: Cluster-wide view (read-only) for Argo CD server
# Does NOT allow mutations (all verbs are read-only)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: threadforge-deployer-viewer
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: threadforge-deployer-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: threadforge-deployer-viewer
subjects:
- kind: ServiceAccount
  name: server
  namespace: argocd
