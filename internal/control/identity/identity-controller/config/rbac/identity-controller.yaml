apiVersion: v1
kind: ServiceAccount
metadata:
  name: identity-controller
  namespace: spire-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: identity-controller
rules:
  - apiGroups: ["identity.threadforge.local"]
    resources: ["identityregistrations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["identity.threadforge.local"]
    resources: ["identityregistrations/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: identity-controller
subjects:
  - kind: ServiceAccount
    name: identity-controller
    namespace: spire-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: identity-controller